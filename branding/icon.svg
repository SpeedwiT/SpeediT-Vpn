<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.5" stop-color="#111113"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="bolt" x1="360" y1="150" x2="680" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c6c6cf"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#ffffff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- speed motion lines -->
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-linecap="round" fill="none">
    <path d="M150 470 H360" stroke-width="26"/>
    <path d="M150 560 H300" stroke-width="26"/>
    <path d="M150 650 H360" stroke-width="26"/>
  </g>

  <!-- bold lightning "S/speed" monogram -->
  <path d="M612 150 L372 548 H506 L452 874 L724 452 H566 Z"
        fill="url(#bolt)" filter="url(#glow)"/>
  <path d="M612 150 L372 548 H506 L452 874 L724 452 H566 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
</svg>

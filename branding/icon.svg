<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#232327"/>
      <stop offset="0.55" stop-color="#101012"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="sphere" cx="0.4" cy="0.33" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#e9e9ee"/>
      <stop offset="1" stop-color="#9a9aa4"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- orbit ring (tilted) -->
  <g transform="translate(512,520) rotate(-24)">
    <ellipse rx="332" ry="140" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="10"/>
    <circle cx="332" cy="0" r="15" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <!-- glossy sphere -->
  <circle cx="512" cy="512" r="236" fill="url(#sphere)" filter="url(#sh)"/>
  <!-- top specular highlight -->
  <ellipse cx="452" cy="420" rx="110" ry="60" fill="url(#gloss)" opacity="0.6"/>

  <!-- power / bolt mark -->
  <path d="M560 356 L430 578 H512 L484 690 L612 452 H524 Z" fill="#101012"/>
</svg>

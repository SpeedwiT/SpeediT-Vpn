name: speedit
description: SpeediT — a fast, secure, multi-protocol VPN client for Android and Windows.
publish_to: "none"
version: 1.0.0+14

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_v2ray: 2.0.0         # Android core (Xray). 2.0.0's core connects + measures
                               # delay; 1.0.10's bundled core is too old for modern configs.
  shared_preferences: ^2.2.3   # local persistence (servers, subs, settings)
  http: ^1.2.1                 # fetch subscription contents
  mobile_scanner: ^5.2.3       # QR import
  url_launcher: ^6.3.0         # open Telegram channel
  package_info_plus: ^8.0.2    # app version in About
  provider: ^6.1.2             # state management
  permission_handler: ^11.3.1  # runtime notification permission (keeps the VPN FGS alive)
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0b1030"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 24

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
  fonts:
    - family: Estedad
      fonts:
        - asset: assets/fonts/Estedad-Regular.ttf
        - asset: assets/fonts/Estedad-Bold.ttf
          weight: 700
        - asset: assets/fonts/Estedad-Black.ttf
          weight: 900

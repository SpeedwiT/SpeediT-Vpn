name: Build V2hype

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.29.0"
  SINGBOX_VERSION: "1.9.3"

jobs:
  # ------------------------------------------------------------------ Android
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Scaffold android platform + apply V2hype overlay
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --org com.speedit --project-name v2hype --platforms=android
          cp /tmp/pubspec.yaml pubspec.yaml
          bash tool/apply_overlay.sh

      - name: Use the fixed debug key (stable signature across all builds)
        run: |
          mkdir -p "$HOME/.android"
          cp tool/debug.keystore "$HOME/.android/debug.keystore"

      - name: Dependencies + launcher icons
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APKs (release, debug-signed for sideloading)
        run: flutter build apk --release --split-per-abi

      - name: Rename artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   dist/V2hype-android-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/V2hype-android-armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      dist/V2hype-android-x86_64.apk || true

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  # ------------------------------------------------------------------ Windows
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Scaffold windows platform + apply overlay
        shell: bash
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter config --enable-windows-desktop
          flutter create . --org com.speedit --project-name v2hype --platforms=windows
          cp /tmp/pubspec.yaml pubspec.yaml

      - name: Dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Bundle sing-box core
        shell: pwsh
        run: |
          $ver = "${{ env.SINGBOX_VERSION }}"
          $url = "https://github.com/SagerNet/sing-box/releases/download/v$ver/sing-box-$ver-windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile singbox.zip
          Expand-Archive singbox.zip -DestinationPath singbox
          $rel = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Force -Path "$rel/core" | Out-Null
          Copy-Item "singbox/sing-box-$ver-windows-amd64/sing-box.exe" "$rel/core/sing-box.exe"

      - name: Package
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          Compress-Archive -Path "$rel/*" -DestinationPath "V2hype-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: V2hype-windows-x64.zip

  # ------------------------------------------------------------------ Release
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: android, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: windows, path: dist }
      - name: Remove previous releases (keep a single clean v1.0.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.1 --repo "${{ github.repository }}" --yes --cleanup-tag || true
          gh release delete v1.0.0 --repo "${{ github.repository }}" --yes --cleanup-tag || true
      - name: Publish release (creates the v1.0.0 tag server-side)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: V2hype v1.0.0
          files: dist/*
          generate_release_notes: true
